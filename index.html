<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="menu">
      <div class="logos">
        <img
          src="https://static.vecteezy.com/system/resources/previews/022/424/463/non_2x/linkedin-logo-editorial-free-vector.jpg"
          alt="linkedinLogo"
        />
      </div>
      <div class="search">
        <input type="Search" placeholder="&#128269; Search" />
      </div>
      <div class="logos">
        <img src="home.svg" alt="HomeIcon" />
        <h5>Home</h5>
      </div>
      <div class="logos">
        <img src="people.svg" alt="MyNetworkIcon" />
        <h5>My Network</h5>
      </div>
      <div class="logos">
        <img src="briefcase.svg" alt="JobsIcon" />
        <h5>Jobs</h5>
      </div>
      <div class="logos">
        <img src="chatbubble-ellipses.svg" alt="MessagingIcon" />
        <h5>Messages</h5>
      </div>
      <div class="logos">
        <img src="notifications.svg" alt="NotificationsIcon" />
        <h5>Notifications</h5>
      </div>

     <div class="logos">
        <img src="person-circle.svg" alt="ProfileIcon" />
        <h5>Me<img class="caret" src="caret-down.svg" alt="OP" /></h5>
     </div>

      <div class="logos" id="business">
        <img src="apps.svg" alt="BussinessIcon" />
        <h5>For Business <img class="caret" src="caret-down.svg" alt="OP" /></h5>
      </div>

      <div class="logos">
        <img src="square.svg" alt="premium" />
        <h5>Premium</h5>
      </div>
    </div>
  </body>
</html>
